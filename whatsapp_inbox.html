<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platicón — Inbox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#16201c;
    --paper:#f6f4ee;
    --line:#dcd8cc;
    --sage:#4f7a68;
    --sage-dark:#33574a;
    --sage-light:#e4ede8;
    --amber:#c98a3a;
    --muted:#7a7d72;
    --white:#ffffff;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- PIN GATE ---------- */
  #gate{
    position:fixed;inset:0;background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
  }
  #gate.hidden{display:none;}
  .gate-box{
    background:var(--paper);border-radius:4px;padding:40px 36px;
    width:280px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .gate-box .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--sage);margin-bottom:6px;
  }
  .gate-box h1{font-size:19px;margin:0 0 22px;font-weight:600;}
  .gate-box input{
    width:100%;padding:12px;font-size:20px;letter-spacing:.3em;
    text-align:center;border:1px solid var(--line);border-radius:4px;
    background:var(--white);font-family:var(--mono);margin-bottom:14px;
    outline:none;
  }
  .gate-box input:focus{border-color:var(--sage);}
  .gate-box button{
    width:100%;padding:12px;background:var(--sage);color:#fff;border:none;
    border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--sans);transition:background .15s;
  }
  .gate-box button:hover{background:var(--sage-dark);}
  .gate-err{color:#b3543a;font-size:12px;margin-top:10px;font-family:var(--mono);min-height:16px;}

  /* ---------- APP LAYOUT ---------- */
  #app{display:none;height:100vh;}
  #app.visible{display:flex;}

  /* sidebar */
  .sidebar{
    width:340px;min-width:280px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--white);
  }
  .sidebar-head{
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
  }
  .sidebar-head .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--sage);margin-bottom:4px;
  }
  .sidebar-head h1{margin:0;font-size:18px;font-weight:700;}
  .sidebar-head .count{
    font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;
  }
  .conv-list{flex:1;overflow-y:auto;}
  .conv-item{
    padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .1s;position:relative;
  }
  .conv-item:hover{background:var(--sage-light);}
  .conv-item.active{background:var(--sage-light);border-left:3px solid var(--sage);padding-left:17px;}
  .conv-item .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .conv-item .name{font-weight:600;font-size:14.5px;}
  .conv-item .time{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .conv-item .preview{
    font-size:13px;color:var(--muted);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .conv-item .phone{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
  .badge-abierta{
    display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;background:var(--sage);color:#fff;
    padding:1px 6px;border-radius:2px;margin-left:6px;vertical-align:middle;
  }
  .badge-cerrada{background:var(--muted);}
  .empty-list{padding:40px 20px;color:var(--muted);font-size:13px;text-align:center;}

  /* chat pane */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-head{
    padding:16px 28px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;background:var(--white);
  }
  .chat-head .name{font-weight:700;font-size:16px;}
  .chat-head .phone{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .chat-head .stage{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--sage);border:1px solid var(--sage);padding:3px 9px;border-radius:20px;
  }
  .chat-empty{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;flex-direction:column;gap:8px;
  }
  .chat-empty .glyph{font-size:30px;opacity:.4;}
  .messages{
    flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:10px;
    background:
      linear-gradient(var(--paper),var(--paper));
  }
  .msg{max-width:62%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.45;position:relative;}
  .msg .meta{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:5px;display:block;}
  .msg.contacto{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-bottom-left-radius:2px;}
  .msg.agente{align-self:flex-end;background:var(--sage);color:#fff;border-bottom-right-radius:2px;}
  .msg.agente .meta{color:rgba(255,255,255,.75);}

  .composer{
    border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;
    background:var(--white);
  }
  .composer textarea{
    flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-family:var(--sans);font-size:14px;outline:none;line-height:1.4;max-height:120px;
  }
  .composer textarea:focus{border-color:var(--sage);}
  .composer button{
    background:var(--sage);color:#fff;border:none;border-radius:8px;padding:0 20px;
    font-weight:600;font-size:13px;cursor:pointer;transition:background .15s;
  }
  .composer button:hover{background:var(--sage-dark);}
  .composer button:disabled{background:var(--line);cursor:default;color:var(--muted);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;
    font-family:var(--mono);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;}
  .toast.err{background:#8a3b2a;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---------- TABS ---------- */
  .tabbar{
    display:flex;border-bottom:1px solid var(--line);background:var(--white);
    flex-shrink:0;
  }
  .tabbar button{
    flex:1;padding:13px 0;background:none;border:none;cursor:pointer;
    font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  }
  .tabbar button.active{color:var(--sage-dark);border-bottom-color:var(--sage);}
  .tabbar button:hover{color:var(--sage-dark);}
  #appBody{flex:1;display:flex;min-height:0;}

  /* ---------- AGENDA ---------- */
  .agenda{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);}
  .agenda-head{
    padding:18px 28px;border-bottom:1px solid var(--line);background:var(--white);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .agenda-head .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--sage);margin-bottom:4px;
  }
  .agenda-head h1{margin:0;font-size:18px;font-weight:700;}
  .agenda-head .fecha{font-family:var(--mono);font-size:12.5px;color:var(--muted);}
  .agenda-list{flex:1;overflow-y:auto;padding:20px 28px;}
  .cita-row{
    display:flex;align-items:center;gap:16px;background:var(--white);
    border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px;
  }
  .cita-row .hora{
    font-family:var(--mono);font-size:15px;font-weight:700;color:var(--sage-dark);
    min-width:78px;
  }
  .cita-row .info{flex:1;min-width:0;}
  .cita-row .info .nombre{font-weight:600;font-size:14.5px;}
  .cita-row .info .detalle{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .cita-badge{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;white-space:nowrap;
  }
  .cita-badge.confirmada{background:var(--sage-light);color:var(--sage-dark);}
  .cita-badge.pendiente,.cita-badge.pendiente_datos{background:#fbeed9;color:var(--amber);}

  /* ---------- VENTANA 24H ---------- */
  .ventana-badge{
    font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:20px;
    white-space:nowrap;
  }
  .ventana-badge.ok{background:var(--sage-light);color:var(--sage-dark);}
  .ventana-badge.media{background:#fbeed9;color:var(--amber);}
  .ventana-badge.urgente{background:#f6ddd3;color:#a1512c;}
  .ventana-badge.cerrada{background:#f2e3df;color:#8a3b2a;}
  .cita-badge.cancelada{background:#f2e3df;color:#8a3b2a;}
  .cita-badge.completada{background:var(--line);color:var(--muted);}
  .agenda-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---------- NAV DE FECHA EN AGENDA ---------- */
  .agenda-nav{display:flex;align-items:center;gap:10px;}
  .agenda-nav button{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--ink);
    transition:background .15s;
  }
  .agenda-nav button:hover{background:var(--sage-light);}
  .agenda-nav .btn-hoy{width:auto;padding:0 12px;font-family:var(--sans);font-size:12.5px;font-weight:600;}
  .fecha-actual{position:relative;}
  .fecha-actual .fecha{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);cursor:pointer;
    text-transform:capitalize;padding:6px 10px;border:1px solid var(--line);
    border-radius:6px;display:inline-block;background:var(--white);
  }
  .fecha-actual input[type=date]{
    position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;
  }
  .cita-row .especialista{
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--sage-dark);background:var(--sage-light);padding:2px 8px;border-radius:20px;
    margin-top:4px;display:inline-block;
  }
  .cita-row .contacto-info{font-size:11.5px;color:var(--muted);margin-top:3px;}

  /* ---------- PIPELINE (KANBAN) ---------- */
  .pipeline{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);}
  .pipeline-head{padding:18px 28px;border-bottom:1px solid var(--line);background:var(--white);}
  .pipeline-head .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--sage);margin-bottom:4px;
  }
  .pipeline-head h1{margin:0;font-size:18px;font-weight:700;}
  .pipeline-board{flex:1;display:flex;gap:16px;overflow-x:auto;padding:20px 28px;align-items:flex-start;}
  .pipeline-col{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    min-width:250px;max-width:270px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%;
  }
  .pipeline-col-head{
    padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .pipeline-col-head .titulo{font-weight:700;font-size:13px;}
  .pipeline-col-head .count{
    font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--paper);
    padding:1px 8px;border-radius:20px;
  }
  .pipeline-col-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .pipeline-card{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  }
  .pipeline-card .nombre{font-weight:600;font-size:13.5px;}
  .pipeline-card .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .pipeline-card .servicio{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pipeline-card .acciones{display:flex;gap:6px;margin-top:8px;}
  .pipeline-card .acciones button{
    flex:1;font-family:var(--sans);font-size:10.5px;font-weight:600;padding:5px 0;
    border-radius:6px;border:1px solid var(--line);background:var(--white);cursor:pointer;
    transition:background .15s;
  }
  .pipeline-card .acciones button.on{background:var(--sage);color:#fff;border-color:var(--sage);}
  .pipeline-card .acciones button:hover{background:var(--sage-light);}
  .pipeline-card .acciones button.on:hover{background:var(--sage-dark);}
  .pipeline-card .cerrar-btn{
    margin-top:8px;width:100%;font-family:var(--sans);font-size:10.5px;font-weight:700;
    padding:6px 0;border-radius:6px;border:none;background:var(--amber);color:#fff;cursor:pointer;
  }
  .pipeline-empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="eyebrow">🦜 Platicón</div>
    <h1>Inbox privado</h1>
    <input type="password" id="pinInput" maxlength="6" placeholder="••••" autofocus inputmode="numeric">
    <button onclick="checkPin()">Entrar</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app" style="flex-direction:column;">
  <div class="tabbar">
    <button id="tabInboxBtn" class="active" onclick="showTab('inbox')">💬 Inbox</button>
    <button id="tabAgendaBtn" onclick="showTab('agenda')">📅 Agenda</button>
    <button id="tabPipelineBtn" onclick="showTab('pipeline')">📋 Pipeline</button>
  </div>

  <div id="appBody">
    <div id="inboxView" style="display:flex;flex:1;min-width:0;">
      <div class="sidebar">
        <div class="sidebar-head">
          <div class="eyebrow">Conversaciones</div>
          <h1>🦜 Platicón</h1>
          <div class="count" id="convCount">cargando…</div>
        </div>
        <div class="conv-list" id="convList"></div>
      </div>

      <div class="chat" id="chat">
        <div class="chat-empty">
          <div class="glyph">◧</div>
          Selecciona una conversación
        </div>
      </div>
    </div>

    <div id="agendaView" class="agenda" style="display:none;">
      <div class="agenda-head">
        <div>
          <div class="eyebrow">Agenda</div>
          <h1 id="agendaNegocioNombre">Cargando…</h1>
        </div>
        <div class="agenda-nav">
          <button onclick="cambiarDiaAgenda(-1)" title="Día anterior">←</button>
          <div class="fecha-actual">
            <span class="fecha" id="agendaFecha"></span>
            <input type="date" id="agendaFechaInput" onchange="irAFechaAgenda(this.value)">
          </div>
          <button onclick="cambiarDiaAgenda(1)" title="Día siguiente">→</button>
          <button class="btn-hoy" onclick="irAHoyAgenda()">Hoy</button>
        </div>
      </div>
      <div class="agenda-list" id="agendaList"></div>
    </div>

    <div id="pipelineView" class="pipeline" style="display:none;">
      <div class="pipeline-head">
        <div class="eyebrow">Pipeline de citas</div>
        <h1>Seguimiento</h1>
      </div>
      <div class="pipeline-board" id="pipelineBoard"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG ======
const SUPABASE_URL = 'https://bfyrxykuaqxvbqtjojoe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmeXJ4eWt1YXF4dmJxdGpvam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODEyNTYsImV4cCI6MjA5NDM1NzI1Nn0.-qF-Cqzj2nvlkaKDzDlGQcmj2L-OGbcrsCDNAlP_sxI';
const SEND_WEBHOOK = 'https://comunicacionesenlanube.app.n8n.cloud/webhook/piloto-enviar-mensaje';
const PIN = '6734'; // mismo PIN que EventosADMON, cámbialo si quieres uno distinto
const NEGOCIO_ID = 'bddaa66a-6e68-4216-9855-935d1bc9683d'; // Barbería Piloto — fijo hasta tener multi-negocio real

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let conversaciones = [];
let activeConvId = null;
let activeContacto = null;
let msgChannel = null;
let citasChannel = null;

// ---------- TABS ----------
function showTab(tab){
  const inboxBtn = document.getElementById('tabInboxBtn');
  const agendaBtn = document.getElementById('tabAgendaBtn');
  const pipelineBtn = document.getElementById('tabPipelineBtn');
  const inboxView = document.getElementById('inboxView');
  const agendaView = document.getElementById('agendaView');
  const pipelineView = document.getElementById('pipelineView');

  [inboxBtn, agendaBtn, pipelineBtn].forEach(b => b.classList.remove('active'));
  [inboxView, agendaView, pipelineView].forEach(v => v.style.display = 'none');

  if(tab === 'agenda'){
    agendaBtn.classList.add('active');
    agendaView.style.display = 'flex';
    loadAgenda();
    subscribeToCitas();
  } else if(tab === 'pipeline'){
    pipelineBtn.classList.add('active');
    pipelineView.style.display = 'flex';
    loadPipeline();
    subscribeToCitas();
  } else {
    inboxBtn.classList.add('active');
    inboxView.style.display = 'flex';
  }
}

// ---------- PIN GATE ----------
function checkPin(){
  const val = document.getElementById('pinInput').value;
  if(val === PIN){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
    sessionStorage.setItem('inbox_pin_ok','1');
    init();
  } else {
    document.getElementById('gateErr').textContent = 'PIN incorrecto';
    document.getElementById('pinInput').value = '';
  }
}
document.getElementById('pinInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') checkPin();
});
if(sessionStorage.getItem('inbox_pin_ok') === '1'){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  init();
}

// ---------- HELPERS ----------
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=> t.className='toast', 2200);
}
function fmtTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay
    ? d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- VENTANA DE 24H DE WHATSAPP ----------
// Solo se puede mandar texto libre si el cliente escribió en las últimas 24h.
// Pasado eso, hace falta una plantilla aprobada por Meta.
function ventana24h(ultimoMensajeCliente){
  if(!ultimoMensajeCliente) return { horasRestantes: 0, cerrada: true, label: 'Sin mensajes', clase: 'cerrada' };
  const transcurridoMs = Date.now() - new Date(ultimoMensajeCliente).getTime();
  const restanteMs = 24 * 60 * 60 * 1000 - transcurridoMs;
  if(restanteMs <= 0) return { horasRestantes: 0, cerrada: true, label: 'Ventana cerrada', clase: 'cerrada' };
  const horas = Math.floor(restanteMs / 3600000);
  const mins = Math.floor((restanteMs % 3600000) / 60000);
  const label = horas > 0 ? `${horas}h ${mins}min` : `${mins}min`;
  const clase = restanteMs < 3 * 3600000 ? 'urgente' : (restanteMs < 8 * 3600000 ? 'media' : 'ok');
  return { horasRestantes: restanteMs / 3600000, cerrada: false, label, clase };
}

// ---------- LOAD CONVERSATIONS ----------
async function loadConversaciones(){
  const { data, error } = await sb
    .from('conversaciones')
    .select('id,estado,pipeline_stage,ultima_actividad,ultimo_mensaje_cliente,contacto_id,contactos(nombre,telefono)')
    .order('ultima_actividad', { ascending:false });

  if(error){ showToast('Error cargando conversaciones', true); console.error(error); return; }

  conversaciones = data || [];
  renderConvList();
}

async function renderConvList(){
  const list = document.getElementById('convList');
  document.getElementById('convCount').textContent = conversaciones.length + ' conversación(es)';

  if(!conversaciones.length){
    list.innerHTML = '<div class="empty-list">Sin conversaciones todavía.<br>Manda un WhatsApp de prueba al número piloto.</div>';
    return;
  }

  // último mensaje de cada conversación (para preview)
  const previews = {};
  await Promise.all(conversaciones.map(async c => {
    const { data } = await sb.from('mensajes')
      .select('contenido,remitente')
      .eq('conversacion_id', c.id)
      .order('timestamp', { ascending:false })
      .limit(1);
    previews[c.id] = data && data[0] ? data[0] : null;
  }));

  list.innerHTML = conversaciones.map(c => {
    const nombre = (c.contactos && c.contactos.nombre) || 'Sin nombre';
    const telefono = (c.contactos && c.contactos.telefono) || '';
    const prev = previews[c.id];
    const prevText = prev ? (prev.remitente === 'agente' ? 'Tú: ' : '') + escapeHtml(prev.contenido || '') : '—';
    const badgeClass = c.estado === 'abierta' ? 'badge-abierta' : 'badge-cerrada';
    const v = ventana24h(c.ultimo_mensaje_cliente);
    return `
      <div class="conv-item ${c.id===activeConvId?'active':''}" onclick="openConv('${c.id}')">
        <div class="row1">
          <span class="name">${escapeHtml(nombre)}<span class="${badgeClass}">${c.estado}</span></span>
          <span class="time">${fmtTime(c.ultima_actividad)}</span>
        </div>
        <div class="preview">${prevText}</div>
        <div class="row1">
          <div class="phone">+${telefono}</div>
          <span class="ventana-badge ${v.clase}" title="Ventana de 24h de WhatsApp">${v.cerrada ? '🔒' : '⏱'} ${v.label}</span>
        </div>
      </div>`;
  }).join('');
}

// ---------- OPEN CONVERSATION ----------
async function openConv(convId){
  activeConvId = convId;
  const conv = conversaciones.find(c => c.id === convId);
  activeContacto = conv.contactos;
  renderConvList();
  renderChatShell(conv);
  await loadMessages(convId);
  subscribeToMessages(convId);
}

function renderChatShell(conv){
  const nombre = (conv.contactos && conv.contactos.nombre) || 'Sin nombre';
  const telefono = (conv.contactos && conv.contactos.telefono) || '';
  const v = ventana24h(conv.ultimo_mensaje_cliente);
  document.getElementById('chat').innerHTML = `
    <div class="chat-head">
      <div>
        <div class="name">${escapeHtml(nombre)}</div>
        <div class="phone">+${telefono}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="ventana-badge ${v.clase}" title="Ventana de 24h de WhatsApp — pasado esto solo se puede mandar plantillas aprobadas">${v.cerrada ? '🔒' : '⏱'} ${v.label}</span>
        <div class="stage">${escapeHtml(conv.pipeline_stage || 'nuevo')}</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="composerInput" placeholder="${v.cerrada ? 'Ventana cerrada — usa una plantilla aprobada' : 'Escribe una respuesta…'}" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
  `;
}

async function loadMessages(convId){
  const { data, error } = await sb.from('mensajes')
    .select('*')
    .eq('conversacion_id', convId)
    .order('timestamp', { ascending:true });

  if(error){ showToast('Error cargando mensajes', true); console.error(error); return; }
  renderMessages(data || []);
}

function renderMessages(msgs){
  const box = document.getElementById('messages');
  if(!box) return;
  box.innerHTML = msgs.map(m => `
    <div class="msg ${m.remitente === 'agente' ? 'agente' : 'contacto'}">
      ${escapeHtml(m.contenido || '')}
      <span class="meta">${fmtTime(m.timestamp)}</span>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

// ---------- REALTIME ----------
function subscribeToMessages(convId){
  if(msgChannel) sb.removeChannel(msgChannel);
  msgChannel = sb.channel('mensajes-' + convId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'mensajes',
      filter: `conversacion_id=eq.${convId}`
    }, () => {
      loadMessages(convId);
      loadConversaciones();
    })
    .subscribe();
}

// ---------- SEND ----------
async function sendMessage(){
  const input = document.getElementById('composerInput');
  const texto = input.value.trim();
  if(!texto || !activeConvId) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';

  try{
    const res = await fetch(SEND_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversacion_id: activeConvId,
        telefono: activeContacto.telefono,
        texto
      })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    showToast('Enviado');
  } catch(err){
    console.error(err);
    showToast('Error al enviar — revisa n8n', true);
  } finally {
    btn.disabled = false;
  }
}

// ---------- AGENDA ----------
let fechaAgendaActual = hoyISO();

function hoyISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtFechaLarga(iso){
  // Evita el corrimiento de zona horaria al parsear 'YYYY-MM-DD' directo
  const [y,m,d] = iso.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  return dateObj.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
}

function cambiarDiaAgenda(delta){
  const [y,m,d] = fechaAgendaActual.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  dateObj.setDate(dateObj.getDate() + delta);
  fechaAgendaActual = hoyISOde(dateObj);
  loadAgenda();
}

function irAHoyAgenda(){
  fechaAgendaActual = hoyISO();
  loadAgenda();
}

function irAFechaAgenda(valor){
  if(!valor) return;
  fechaAgendaActual = valor;
  loadAgenda();
}

function hoyISOde(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

async function loadAgenda(){
  const fecha = fechaAgendaActual;
  document.getElementById('agendaFecha').textContent = fmtFechaLarga(fecha);
  document.getElementById('agendaFechaInput').value = fecha;

  const { data: negocio } = await sb.from('negocios').select('nombre').eq('id', NEGOCIO_ID).single();
  document.getElementById('agendaNegocioNombre').textContent = (negocio && negocio.nombre) || 'Agenda';

  const { data, error } = await sb.from('citas')
    .select('*, contactos(nombre,telefono), especialistas(nombre)')
    .eq('negocio_id', NEGOCIO_ID)
    .eq('fecha', fecha)
    .neq('estado', 'cancelada')
    .order('hora_inicio', { ascending:true });

  if(error){ showToast('Error cargando agenda', true); console.error(error); return; }
  renderAgenda(data || []);
}

function renderAgenda(citas){
  const list = document.getElementById('agendaList');
  if(!citas.length){
    list.innerHTML = '<div class="agenda-empty">Sin citas agendadas para este día.</div>';
    return;
  }
  list.innerHTML = citas.map(c => {
    // Prioriza el nombre completo dado al agendar; si no, el de WhatsApp
    const nombre = c.cliente_nombre || (c.contactos && c.contactos.nombre) || 'Sin nombre';
    const telefono = (c.contactos && c.contactos.telefono) || '';
    const hora = (c.hora_inicio || '').slice(0,5);
    const badgeClass = ['confirmada','pendiente','pendiente_datos','cancelada','completada'].includes(c.estado) ? c.estado : 'pendiente';
    const badgeLabel = c.estado === 'pendiente_datos' ? 'esperando datos' : badgeClass;
    return `
      <div class="cita-row">
        <div class="hora">${hora}</div>
        <div class="info">
          <div class="nombre">${escapeHtml(nombre)}</div>
          <div class="detalle">+${telefono}${c.servicio ? ' · ' + escapeHtml(c.servicio) : ''}</div>
          ${c.cliente_email ? `<div class="contacto-info">✉️ ${escapeHtml(c.cliente_email)}</div>` : ''}
          ${c.especialistas && c.especialistas.nombre ? `<span class="especialista">${escapeHtml(c.especialistas.nombre)}</span>` : ''}
        </div>
        <span class="cita-badge ${badgeClass}">${badgeLabel}</span>
      </div>`;
  }).join('');
}

function subscribeToCitas(){
  if(citasChannel) return; // ya suscrito, no duplicar
  citasChannel = sb.channel('citas-hoy')
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'citas',
      filter: `negocio_id=eq.${NEGOCIO_ID}`
    }, () => {
      if(document.getElementById('agendaView').style.display !== 'none') loadAgenda();
      if(document.getElementById('pipelineView').style.display !== 'none') loadPipeline();
    })
    .subscribe();
}

// ---------- PIPELINE ----------
const PIPELINE_COLUMNAS = [
  { estado: 'pendiente_datos', titulo: 'Esperando datos' },
  { estado: 'confirmada_futura', titulo: 'Confirmada' },
  { estado: 'confirmada_hoy', titulo: 'Hoy' },
  { estado: 'completada', titulo: 'Completada' }
];

async function loadPipeline(){
  const { data, error } = await sb.from('citas')
    .select('*, contactos(nombre,telefono), especialistas(nombre)')
    .eq('negocio_id', NEGOCIO_ID)
    .neq('estado', 'cancelada')
    .order('fecha', { ascending:true })
    .order('hora_inicio', { ascending:true });

  if(error){ showToast('Error cargando pipeline', true); console.error(error); return; }
  renderPipeline(data || []);
}

function clasificarColumna(c){
  if(c.estado === 'pendiente_datos') return 'pendiente_datos';
  if(c.estado === 'completada') return 'completada';
  const hoy = hoyISO();
  if(c.fecha === hoy) return 'confirmada_hoy';
  return 'confirmada_futura';
}

function renderPipeline(citas){
  const board = document.getElementById('pipelineBoard');
  board.innerHTML = PIPELINE_COLUMNAS.map(col => {
    const items = citas.filter(c => clasificarColumna(c) === col.estado);
    const cardsHtml = items.length
      ? items.map(c => tarjetaPipeline(c)).join('')
      : '<div class="pipeline-empty">Sin citas aquí</div>';
    return `
      <div class="pipeline-col">
        <div class="pipeline-col-head">
          <span class="titulo">${col.titulo}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="pipeline-col-body">${cardsHtml}</div>
      </div>`;
  }).join('');
}

function tarjetaPipeline(c){
  const nombre = c.cliente_nombre || (c.contactos && c.contactos.nombre) || 'Sin nombre';
  const especialista = c.especialistas && c.especialistas.nombre ? ' · ' + c.especialistas.nombre : '';
  const fechaCorta = (c.fecha || '').slice(5).split('-').reverse().join('/');
  const hora = (c.hora_inicio || '').slice(0,5);
  const listoParaCerrar = c.llego && c.pagado;
  return `
    <div class="pipeline-card" id="card-${c.id}">
      <div class="nombre">${escapeHtml(nombre)}</div>
      <div class="meta">${fechaCorta} · ${hora}${especialista}</div>
      ${c.servicio ? `<div class="servicio">${escapeHtml(c.servicio)}</div>` : ''}
      <div class="acciones">
        <button class="${c.llego ? 'on' : ''}" onclick="toggleCampoCita('${c.id}','llego',${!c.llego})">✓ Llegó</button>
        <button class="${c.pagado ? 'on' : ''}" onclick="toggleCampoCita('${c.id}','pagado',${!c.pagado})">💰 Pagó</button>
      </div>
      ${listoParaCerrar && c.conversacion_id ? `<button class="cerrar-btn" onclick="cerrarCicloConversacion('${c.conversacion_id}','${c.id}')">Cerrar ciclo →</button>` : ''}
    </div>`;
}

async function toggleCampoCita(citaId, campo, valor){
  const cambios = { [campo]: valor };
  if(campo === 'llego' && valor) cambios.estado = 'completada'; // llegó = servicio en curso/hecho
  const { error } = await sb.from('citas').update(cambios).eq('id', citaId);
  if(error){ showToast('Error actualizando', true); console.error(error); return; }
  loadPipeline();
}

async function cerrarCicloConversacion(conversacionId, citaId){
  const { error } = await sb.from('conversaciones').update({ estado:'cerrada' }).eq('id', conversacionId);
  if(error){ showToast('Error cerrando conversación', true); console.error(error); return; }
  showToast('Conversación cerrada — la próxima cita empieza de cero');
  loadPipeline();
}

// ---------- INIT ----------
function init(){
  loadConversaciones();
  // refresco de la lista cada 15s (por si llega mensaje de otra conversación no abierta)
  setInterval(loadConversaciones, 15000);
}
</script>
